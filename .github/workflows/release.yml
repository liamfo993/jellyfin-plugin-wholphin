name: Publish release

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

env:
  NAME: "Jellyfin.Plugin.Wholphin"
  TAG_NAME: ${{ github.ref_name }}

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet run --project Jellyfin.Plugin.Wholphin.Tests --configuration Release
          node --test Jellyfin.Plugin.Wholphin.Tests/HomeSettings.test.cjs

      - name: Build
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $TAG_NAME" >&2
            exit 1
          fi
          dotnet publish "$NAME" --configuration Release -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Zip
        run: |
          mkdir -p ./dist
          find "${{ env.NAME }}/bin/Release/net10.0/publish" -type f -name "*.dll" -print0 | xargs -0 zip -j "./dist/${{ env.NAME }}.zip"

      - name: Checksums
        run: |
          echo "Checksums:"
          sha256sum "./dist/${{ env.NAME }}.zip"
          md5sum "./dist/${{ env.NAME }}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "./dist/$NAME.zip" --clobber
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --verify-tag --notes "See the commit history for changes." "./dist/$NAME.zip"
          fi
          gh release edit "$TAG_NAME" --draft=false --latest

      - name: Update Jellyfin repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKSUM="$(md5sum "./dist/$NAME.zip" | cut -d ' ' -f 1)"
          TIMESTAMP="$(gh release view "$TAG_NAME" --json publishedAt --jq '.publishedAt')"
          export CHECKSUM TIMESTAMP
          git fetch origin main
          git switch -C release-manifest origin/main
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("manifest.json")
          manifest = json.loads(path.read_text())
          version = os.environ["TAG_NAME"][1:]
          if version.count(".") == 2:
              version += ".0"
          versions = manifest[0]["versions"]
          versions[:] = [entry for entry in versions if entry["version"] != version]
          versions.append({
              "version": version,
              "changelog": "See the GitHub release for changes.",
              "targetAbi": "12.1",
              "sourceUrl": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{os.environ["TAG_NAME"]}/{os.environ["NAME"]}.zip',
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"].removesuffix("Z"),
          })
          versions.sort(key=lambda entry: tuple(map(int, entry["version"].split("."))), reverse=True)
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish $TAG_NAME in plugin manifest"
            git push origin HEAD:main
          fi
